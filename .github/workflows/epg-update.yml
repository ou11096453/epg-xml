name: EPG Update

permissions:
  contents: write

concurrency:
  group: epg-update
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    paths:
      - 'days/**'
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  update-epg:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync days from upstream
        run: |
          git config user.name 'github-actions'
          git config user.email 'github-actions@github.com'
          git remote add upstream https://github.com/sumingyd/xml.git || true
          git fetch upstream main --depth=1
          git checkout upstream/main -- days/
          if git diff --cached --quiet days/; then
            echo "No new EPG data from upstream"
          else
            git add days/
            git commit -m "Sync days/ from upstream - $(date -u +%Y-%m-%d %H:%M:%S)"
            git push
          fi

      - name: Merge all day files into epg.xml
        run: python merge_epg.py

      - name: Calculate coverage and generate data
        run: python calculate_coverage.py

      - name: Compress epg.xml
        run: gzip -c epg.xml > epg.xml.gz

      - name: Update timestamp
        run: date -u +"%Y-%m-%dT%H:%M:%SZ" > epg-last-updated.txt

      - name: Configure git and push changes
        run: |
          git add epg.xml epg_data.json epg.xml.gz epg-last-updated.txt
          git commit -m "Update EPG data" || echo "No changes to commit"
          git push || echo "Nothing to push"
